target-version = "py311"
line-length = 119

# Safe, useful subset: Pyflakes (F) plus common readability issues.
# Style-only rules are intentionally left out to avoid large refactors.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Standalone CLI used as a subprocess by the integration.
"custom_components/magister_school/script/*.py" = ["E501"]
